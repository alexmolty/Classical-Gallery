name: Update museum visual index
on:
  # Rebuild when the indexing code or reviewed masterpiece catalogue changes.
  # Data commits go to art-index, so they do not recursively trigger this job.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-museum-index.yml'
      - 'tools/art-index/bootstrap/masterpieces.json'
      - 'tools/art-index/scripts/**'
      - 'tools/art-index/run.py'
      - 'tools/art-index/publish_index.py'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify independent CPU inference from cached catalogue
        type: boolean
        default: false
      color_only:
        description: Backfill color statistics from cached pixels without AI inference
        type: boolean
        default: false
      fetch_color_previews:
        description: Allow serial small-preview requests for missing color pixels
        type: boolean
        default: false
      color_fetch_limit:
        description: Maximum missing previews in a color-only run
        type: number
        default: 256
  schedule:
    - cron: '43 10 * * *'
permissions:
  contents: write
concurrency:
  group: museum-visual-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v6
        with:
          path: tools/art-index/cache
          key: museum-visual-index-v2-${{ github.run_id }}
          restore-keys: museum-visual-index-v2-
      - if: ${{ !inputs.color_only }}
        run: python -m pip install -r tools/art-index/requirements.txt
      - if: ${{ inputs.color_only }}
        run: python -m pip install Pillow==12.3.0
      - uses: actions/checkout@v7
        with:
          ref: art-index
          path: index-publication
      - name: Collect new metadata, analyze missing images and build verified data
        if: ${{ !inputs.color_only }}
        run: python tools/art-index/run.py --publish-dir index-publication ${{ inputs.verify_only && '--skip-collection --verify-portability' || '' }}
      - name: Backfill cached image colors without AI inference
        if: ${{ inputs.color_only }}
        env:
          COLOR_FETCH_LIMIT: ${{ inputs.color_fetch_limit || 256 }}
        run: python tools/art-index/scripts/publish_colors.py --publish-dir index-publication --fetch-limit "$COLOR_FETCH_LIMIT" ${{ inputs.fetch_color_previews && '--fetch-missing' || '' }}
      - name: Publish index data
        working-directory: index-publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh museum visual recommendations'
            git push origin HEAD:art-index
          fi
      - name: Save resumable build cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: tools/art-index/cache
          key: museum-visual-index-v2-${{ github.run_id }}

